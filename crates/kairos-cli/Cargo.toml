[package]
name = "kairos-cli"
version = "0.2.0"
description = "Kairos en ligne de commande : hooks de Claude Code et serveur MCP"
edition = "2021"
authors = ["lucas"]
publish = false

[[bin]]
name = "kairos"
path = "src/main.rs"

[dependencies]
kairos-core = { path = "../kairos-core" }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rmcp = { version = "3.7", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
