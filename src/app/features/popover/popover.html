<div class="frame">
  <!-- Barre fine pour glisser la fenêtre ; les boutons natifs (rouge, jaune, vert) se posent par-dessus, à gauche. -->
  <div class="titlebar" data-tauri-drag-region></div>
  @if (store.quitting() && quitSummary(); as summary) {
    <app-quit-dialog [summary]="summary" (stopAndQuit)="store.quit(true)" (keepAndQuit)="store.quit(false)" (cancelled)="store.cancelQuit()" />
  } @else {
    <k-popover-header [title]="t()('popover.title')" [subtitle]="subtitle()" />
    @if (bannerError(); as error) {
      <app-error-banner [message]="errorText(error)" [retryable]="store.retryable()" (retry)="store.reload()" />
    }
    @if (store.snapshot()) {
      <!-- Base inaccessible : la dernière vue connue reste, grisée et inerte ; seul le bandeau agit. -->
      <div class="view" [class.stale]="store.stale()" [attr.inert]="store.stale() ? '' : null">
        @switch (store.view()) {
          @case ('start') {
            <app-start-view mode="start" />
          }
          @case ('switch') {
            <app-start-view mode="switch" />
          }
          @default {
            <app-running-view />
          }
        }
      </div>
    }
  }
  <p class="sr-only" aria-live="polite">{{ liveText() }}</p>
</div>
